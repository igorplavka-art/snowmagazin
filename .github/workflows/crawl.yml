name: Crawl Snowmagazin

on:
  push:
    branches:
      - main
      - crawler-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Crawl
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            python -m snowmagazin_crawler --output out | tee crawl-summary.json
          else
            python -m snowmagazin_crawler --output out --limit 10 --delay 0.05 | tee crawl-summary.json
          fi

      - name: Package archive
        run: zip -qr snowmagazin-archive.zip out/archive out/articles.csv crawl-summary.json

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: snowmagazin-archive-${{ github.run_id }}
          path: |
            snowmagazin-archive.zip
            out/articles.csv
            crawl-summary.json
          retention-days: 30
          if-no-files-found: error
