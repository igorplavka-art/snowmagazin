name: Crawl Snowmagazin

on:
  push:
    branches:
      - crawler-v1
  workflow_dispatch:
    inputs:
      mode:
        description: Crawl mode
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
          - media-smoke
          - media-full
  issues:
    types:
      - opened

permissions:
  contents: read

jobs:
  crawl:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[snowmagazin-crawl]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
      DISPATCH_MODE: ${{ inputs.mode }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Resolve crawl mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          MODE="${DISPATCH_MODE:-smoke}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${COMMIT_MESSAGE}" == *"[media-full]"* ]]; then
              MODE="media-full"
            elif [[ "${COMMIT_MESSAGE}" == *"[media-smoke]"* ]]; then
              MODE="media-smoke"
            elif [[ "${COMMIT_MESSAGE}" == *"[full]"* ]]; then
              MODE="full"
            else
              MODE="smoke"
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "issues" ]]; then
            if [[ "${ISSUE_TITLE}" == *"media-full"* ]]; then
              MODE="media-full"
            elif [[ "${ISSUE_TITLE}" == *"media-smoke"* ]]; then
              MODE="media-smoke"
            elif [[ "${ISSUE_TITLE}" == *" full"* || "${ISSUE_TITLE}" == *"[full]"* ]]; then
              MODE="full"
            else
              MODE="smoke"
            fi
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Crawl mode: ${MODE}"

      - name: Crawl articles
        if: steps.mode.outputs.mode == 'smoke' || steps.mode.outputs.mode == 'full'
        env:
          PYTHONPATH: src
          CRAWL_MODE: ${{ steps.mode.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CRAWL_MODE}" == "full" ]]; then
            python -m snowmagazin_crawler --output out | tee crawl-summary.json
          else
            python -m snowmagazin_crawler --output out --limit 10 --delay 0.05 | tee crawl-summary.json
          fi

      - name: Crawl media
        if: steps.mode.outputs.mode == 'media-smoke' || steps.mode.outputs.mode == 'media-full'
        env:
          PYTHONPATH: src
          CRAWL_MODE: ${{ steps.mode.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CRAWL_MODE}" == "media-full" ]]; then
            python -m snowmagazin_crawler.media --output media_out --workers 6 | tee media-run-summary.json
          else
            python -m snowmagazin_crawler.media --output media_out --limit 10 --workers 4 | tee media-run-summary.json
          fi

      - name: Package article archive
        if: steps.mode.outputs.mode == 'smoke' || steps.mode.outputs.mode == 'full'
        run: zip -qr snowmagazin-archive.zip out/archive out/articles.csv crawl-summary.json

      - name: Upload article archive artifact
        if: steps.mode.outputs.mode == 'smoke' || steps.mode.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: snowmagazin-archive-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: |
            snowmagazin-archive.zip
            out/articles.csv
            crawl-summary.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload media smoke artifact
        if: steps.mode.outputs.mode == 'media-smoke'
        uses: actions/upload-artifact@v4
        with:
          name: snowmagazin-media-smoke-${{ github.run_id }}
          path: |
            media_out/
            media-run-summary.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload media 2009-2011
        if: steps.mode.outputs.mode == 'media-full'
        uses: actions/upload-artifact@v4
        with:
          name: snowmagazin-media-2009-2011-${{ github.run_id }}
          path: |
            media_out/articles/2009/
            media_out/articles/2010/
            media_out/articles/2011/
            media_out/articles/unknown/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload media 2012-2014
        if: steps.mode.outputs.mode == 'media-full'
        uses: actions/upload-artifact@v4
        with:
          name: snowmagazin-media-2012-2014-${{ github.run_id }}
          path: |
            media_out/articles/2012/
            media_out/articles/2013/
            media_out/articles/2014/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload media 2015-2017
        if: steps.mode.outputs.mode == 'media-full'
        uses: actions/upload-artifact@v4
        with:
          name: snowmagazin-media-2015-2017-${{ github.run_id }}
          path: |
            media_out/articles/2015/
            media_out/articles/2016/
            media_out/articles/2017/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload media 2018-2020
        if: steps.mode.outputs.mode == 'media-full'
        uses: actions/upload-artifact@v4
        with:
          name: snowmagazin-media-2018-2020-${{ github.run_id }}
          path: |
            media_out/articles/2018/
            media_out/articles/2019/
            media_out/articles/2020/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload media 2021-2023
        if: steps.mode.outputs.mode == 'media-full'
        uses: actions/upload-artifact@v4
        with:
          name: snowmagazin-media-2021-2023-${{ github.run_id }}
          path: |
            media_out/articles/2021/
            media_out/articles/2022/
            media_out/articles/2023/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload media 2024-2026
        if: steps.mode.outputs.mode == 'media-full'
        uses: actions/upload-artifact@v4
        with:
          name: snowmagazin-media-2024-2026-${{ github.run_id }}
          path: |
            media_out/articles/2024/
            media_out/articles/2025/
            media_out/articles/2026/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload reconstructed galleries
        if: steps.mode.outputs.mode == 'media-full'
        uses: actions/upload-artifact@v4
        with:
          name: snowmagazin-nextgen-galleries-${{ github.run_id }}
          path: media_out/galleries/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload media manifests
        if: steps.mode.outputs.mode == 'media-full'
        uses: actions/upload-artifact@v4
        with:
          name: snowmagazin-media-manifests-${{ github.run_id }}
          path: |
            media_out/media_files.csv
            media_out/gallery_status.csv
            media_out/failures.csv
            media_out/media-summary.json
            media-run-summary.json
          retention-days: 30
          if-no-files-found: error
