name: Crawl Snowmagazin

on:
  push:
    branches:
      - crawler-v1
  workflow_dispatch:
    inputs:
      mode:
        description: Crawl mode
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
  issues:
    types:
      - opened

permissions:
  contents: read

jobs:
  crawl:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[snowmagazin-crawl]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
      DISPATCH_MODE: ${{ inputs.mode }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Resolve crawl mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          MODE="${DISPATCH_MODE:-smoke}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${COMMIT_MESSAGE}" == *"[full]"* ]]; then
              MODE="full"
            else
              MODE="smoke"
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "issues" ]]; then
            if [[ "${ISSUE_TITLE}" == *" full"* || "${ISSUE_TITLE}" == *"[full]"* ]]; then
              MODE="full"
            else
              MODE="smoke"
            fi
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Crawl mode: ${MODE}"

      - name: Crawl
        env:
          PYTHONPATH: src
          CRAWL_MODE: ${{ steps.mode.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CRAWL_MODE}" == "full" ]]; then
            python -m snowmagazin_crawler --output out | tee crawl-summary.json
          else
            python -m snowmagazin_crawler --output out --limit 10 --delay 0.05 | tee crawl-summary.json
          fi

      - name: Probe missing article HTML
        if: contains(env.COMMIT_MESSAGE, '[probe]')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          curl -L --fail --silent --show-error 'https://snowmagazin.relaxmagazin.sk/freeridove-videa-tyzdna-cast-8-popow-francuzsko-a-hokkaido/' -o probe/freeride-8.html
          curl -L --fail --silent --show-error 'https://snowmagazin.relaxmagazin.sk/kompletne-ceny-listkov-do-stredisk-na-slovensku-su-iba-na-snowmagazine/' -o probe/ceny.html
          curl -L --fail --silent --show-error 'https://snowmagazin.relaxmagazin.sk/zopar-postrehov-ako-si-kupit-freeridove-lyze/' -o probe/freeride-lyze.html

      - name: Package archive
        run: zip -qr snowmagazin-archive.zip out/archive out/articles.csv crawl-summary.json

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: snowmagazin-archive-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: |
            snowmagazin-archive.zip
            out/articles.csv
            crawl-summary.json
            probe/
          retention-days: 30
          if-no-files-found: error
