name: Build final Snowmagazin media failure log

on:
  push:
    branches:
      - crawler-v1

permissions:
  contents: read
  actions: read

jobs:
  report:
    if: contains(github.event.head_commit.message, '[final-failure-log]')
    runs-on: ubuntu-latest
    steps:
      - name: Download original media manifest
        uses: actions/download-artifact@v4
        with:
          name: snowmagazin-media-manifests-33889118912
          path: original
          repository: igorplavka-art/snowmagazin
          run-id: 33889118912
          github-token: ${{ github.token }}

      - name: Download retry manifest
        uses: actions/download-artifact@v4
        with:
          name: media-retry-manifest
          path: retry
          repository: igorplavka-art/snowmagazin
          run-id: 33893433511
          github-token: ${{ github.token }}

      - name: Build durable failure report
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlparse

          original = list(csv.DictReader(open('original/media_out/media_files.csv', encoding='utf-8')))
          retry = list(csv.DictReader(open('retry/retry_results.csv', encoding='utf-8')))
          retry_by_source = {r['source_url']: r for r in retry}

          failures=[]
          for r in original:
              if r.get('status') != 'error':
                  continue
              rr = retry_by_source.get(r.get('source_url',''))
              if rr and rr.get('retry_status') == 'ok':
                  continue
              final_error = (rr or {}).get('retry_error') or r.get('error','')
              source=r.get('source_url','')
              failures.append({
                  'article_title': r.get('article_title',''),
                  'article_url': r.get('article_url',''),
                  'year': r.get('year',''),
                  'source_url': source,
                  'host': urlparse(source).netloc,
                  'original_error': r.get('error',''),
                  'final_error': final_error,
                  'retry_attempted': 'yes' if rr else 'no',
              })

          def category(err):
              err=err or ''
              for code in ('404','403','429','500','502','503','504'):
                  if f'HTTP {code}' in err: return f'HTTP {code}'
              if 'not-image' in err: return 'not-image'
              if 'ConnectionError' in err: return 'ConnectionError'
              if 'Timeout' in err: return 'Timeout'
              return 'other'

          for r in failures:
              r['category']=category(r['final_error'])

          out=Path('report'); out.mkdir(exist_ok=True)
          fields=['category','year','host','article_title','article_url','source_url','original_error','final_error','retry_attempted']
          with (out/'durable_media_failures.csv').open('w',encoding='utf-8',newline='') as fh:
              w=csv.DictWriter(fh,fieldnames=fields); w.writeheader(); w.writerows(failures)

          reasons=Counter(r['category'] for r in failures)
          hosts=Counter(r['host'] for r in failures)
          years=Counter(r['year'] for r in failures)
          summary={
              'durable_failures':len(failures),
              'by_category':dict(reasons.most_common()),
              'top_hosts':dict(hosts.most_common(15)),
              'by_year':dict(sorted(years.items())),
          }
          (out/'durable_media_failures_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          print('--- FAILURES ---')
          for r in failures:
              print(f"{r['category']} | {r['year']} | {r['host']} | {r['article_title']} | {r['source_url']}")
          PY

      - name: Upload final failure log
        uses: actions/upload-artifact@v4
        with:
          name: final-media-failure-log
          path: report/
          if-no-files-found: error
